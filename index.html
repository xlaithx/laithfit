<style>
  /* Layout: one column phone app, sticky header, fixed 4-tab bottom bar, cards on a charcoal ground. */
  :root {
    --ink: #0b0f14;
    --panel: #131a23;
    --line: #263142;
    --fg: #e7edf4;
    --em: #14d18f;
    --bolt: #2f8cff;
    color-scheme: dark;
  }
  html, body { background: var(--ink); color: var(--fg); }
  body {
    margin: 0;
    font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    font-size: 16px;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior-y: none;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0 0 auto;
    height: env(safe-area-inset-top, 0px);
    z-index: 30;
    background: var(--ink);
  }
  [hidden] { display: none !important; }
  .gutter {
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .app-header { top: env(safe-area-inset-top, 0px); }
  .bottom-nav {
    padding-bottom: env(safe-area-inset-bottom, 0px);
    padding-left: env(safe-area-inset-left, 0px);
    padding-right: env(safe-area-inset-right, 0px);
  }
  .main-pad { padding-bottom: calc(104px + env(safe-area-inset-bottom, 0px)); }
  .sheet-pad { padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)); }
  .num { font-variant-numeric: tabular-nums; }
  h1, h2, h3 { text-wrap: balance; }
  .label { letter-spacing: 0.08em; text-transform: uppercase; font-size: 11px; font-weight: 600; color: #8b98a9; }
  input, select, textarea { font-size: 16px; }
  input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  input[type=date]::-webkit-calendar-picker-indicator { filter: invert(0.8); }
  .field {
    width: 100%;
    min-height: 52px;
    border-radius: 14px;
    background: #0e141c;
    border: 1px solid #263142;
    padding: 0 14px;
    color: #e7edf4;
    outline: none;
  }
  .field:focus { border-color: #14d18f; box-shadow: 0 0 0 3px rgba(20,209,143,0.18); }
  .field.blue:focus { border-color: #2f8cff; box-shadow: 0 0 0 3px rgba(47,140,255,0.2); }
  textarea.field { padding: 12px 14px; min-height: 96px; }
  button:focus-visible, a:focus-visible { outline: 2px solid #2f8cff; outline-offset: 2px; }
  .field::placeholder { color: #4d5a6b; opacity: 1; }
  .tap { min-height: 52px; }
  .press { transition: transform .08s ease, background-color .15s ease, opacity .15s ease; }
  .press:active { transform: scale(0.97); }
  .water-cell { transition: background-color .15s ease, border-color .15s ease; }
  .bar-fill { transition: width .4s ease; }
  .ring-fg { transition: stroke-dashoffset .5s ease; }
  .sheet { animation: sheetUp .22s ease-out; }
  @keyframes sheetUp { from { transform: translateY(24px); opacity: .6; } to { transform: none; opacity: 1; } }
  .toast { animation: toastIn .2s ease-out; }
  @keyframes toastIn { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .sheet, .toast { animation: none; }
    .press, .bar-fill, .ring-fg, .water-cell { transition: none; }
  }
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { scrollbar-width: none; }
</style>
</head>
<body>
  <header class="app-header sticky z-20 bg-ink/95 backdrop-blur border-b border-line">
    <div class="gutter py-3 flex items-center justify-between gap-3 max-w-xl mx-auto">
      <div class="min-w-0">
        <div class="font-display text-xl font-bold tracking-tight leading-none">Laith<span class="text-em">Fit</span></div>
        <div id="header-date" class="text-xs text-mute mt-1 num"></div>

<script>

  /* ---------- Date and number helpers ---------- */

  /* ---------- State and storage ---------- */
  function defaults() {

      version: 1,
      profile: {
        startWeight: null,
        height: 172,
        startDate: null,
        calorieBase: 1600,
        proteinGoal: 160,
        planVersion: 2,
        breakfast: 'boiled',
        snack: 'whey',

      weights: [],
      meals: [],
      water: {},
      activities: [],
      workouts: [],

  var storageOK = true;
  function storageAvailable() {

  function normalize(s) {

      version: 1,
      profile: prof,
      weights: Array.isArray(s.weights) ? s.weights.filter(function (w) { return w && isValidDate(w.date) && isFinite(w.kg); }) : [],
      meals: Array.isArray(s.meals) ? s.meals.filter(function (m) { return m && isValidDate(m.date); }) : [],
      water: s.water && typeof s.water === 'object' ? s.water : {},
      activities: Array.isArray(s.activities) ? s.activities : [],
      workouts: Array.isArray(s.workouts) ? s.workouts : [],

  function load() {

    }
  }

  function save() {
    syncStart();
    if (!storageOK) return;

      localStorage.setItem(KEY, JSON.stringify(state));

  var state = load();

      { bmi: 35, label: 'Out of obesity class II' },
      { bmi: 30, label: 'Out of obesity class I' },
      { bmi: 25, label: 'Healthy BMI range' }

      var w = Math.floor((steps[i].bmi * h2 - 0.05) * 10) / 10;

  var BADGES = {

    early: { text: 'Strong start', cls: 'bg-em-soft text-em border-em/40' },

  function feedback() {
    var weeks = weeklyAverages();

      return {
        status: 'baseline',
        title: 'Your plan starts with your first weigh-in',
        body: 'On the morning you start, weigh yourself after the bathroom and before food or water, and log it in the Weight tab. That number becomes your starting weight and that day becomes day 1. After that, weigh in every morning in the same clothes. Daily readings swing by up to a kilo from water alone, so this app judges you on the weekly average, never on a single day.',

    switch (last.status) {

        t.tips = ['Keep protein at ' + protein + ' g and your water at 3.5 L.', 'Try to add 1 rep or 2.5 kg to one lift this week.'];
        break;
      case 'early':
        t.title = 'Strong start';

      case 'fastish':
        t.title = 'A little faster than planned';

        t.tips = ['Eat back about half of your logged exercise calories on hard training days.', 'Check that your lifts are not dropping. If they are, eat a little more.'];
        break;
      case 'fast':

        t.body = 'Down ' + f1(loss) + ' kg in a week' + note + '. Losing more than 2 kg a week usually means you are eating well under plan, and some of it will be muscle. Eat your full ' + fmtInt(P().calorieBase) + ' kcal every day and reach ' + protein + ' g of protein.';
        t.tips = ['Eat back part of your exercise calories, especially after Leg Day.', 'If you feel dizzy, weak, or unusually tired, talk to your doctor.'];

        t.tips = ['Log cooking oil, sauces and drinks. A tablespoon of oil is about 120 kcal.', 'Add 2,000 steps a day, or one extra 30 minute incline walk.'];

      case 'stall':

      li(['Fridge: up to 3 days. This is why there are two cooks a week.', 'Prefer one big Sunday cook? Freeze 6 boxes straight away and move one to the fridge the night before you eat it.', 'Reheat until steaming hot all the way through. Never reheat rice twice.', 'Cooked rice left at room temperature can grow bacteria that reheating does not kill, so chill it fast.']) +
      '<h3 class="font-display font-bold mt-5">Keeping it tasty</h3>' +
      li(['Free extras: hot sauce, salsa, mustard, lemon, pickles, chilli flakes.', 'Watch out for mayo and creamy sauces: about 100 kcal per tablespoon.', 'Swap chicken for lean beef (5% fat) or canned tuna now and then. Log it with Quick add.']) +
      '<button type="button" data-action="close-sheet" class="press tap w-full mt-5 rounded-2xl bg-panel2 border border-line font-semibold">Close</button>'
    );
  }

  function bar(pct, color) {
    var p = clamp(pct, 0, 100);
    return '<div class="h-3 w-full rounded-full bg-ink border border-line overflow-hidden"><div class="bar-fill h-full rounded-full ' + color + '" style="width:' + p.toFixed(1) + '%"></div></div>';
  }

  function ring(pct, colorHex, size, stroke, inner) {
    var r = (size - stroke) / 2;
    var c = 2 * Math.PI * r;
    var p = clamp(pct, 0, 100);
    var off = c * (1 - p / 100);
    return '<div class="relative shrink-0" style="width:' + size + 'px;height:' + size + 'px">' +
      '<svg width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '" style="transform:rotate(-90deg)">' +
      '<circle cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" fill="none" stroke="#1f2937" stroke-width="' + stroke + '"></circle>' +
      '<circle class="ring-fg" cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" fill="none" stroke="' + colorHex + '" stroke-width="' + stroke + '" stroke-linecap="round" stroke-dasharray="' + c.toFixed(2) + '" stroke-dashoffset="' + off.toFixed(2) + '"></circle>' +
      '</svg><div class="absolute inset-0 flex flex-col items-center justify-center text-center">' + inner + '</div></div>';
  }

  function card(inner, extra) {
    return '<section class="rounded-3xl bg-panel border border-line p-4' + (extra ? ' ' + extra : '') + '">' + inner + '</section>';
  }

  function toast(msg) {
    var wrap = document.getElementById('toast-wrap');
    var el = document.createElement('div');
    el.className = 'toast pointer-events-auto rounded-2xl bg-fg text-ink font-semibold px-4 py-3 shadow-lg text-sm mx-4';
    el.textContent = msg;
    wrap.innerHTML = '';
    wrap.appendChild(el);
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 2200);
  }

  /* ---------- Sheet (modal) ---------- */
  var sheetOnClose = null;
  function openSheet(html, onClose) {
    document.getElementById('sheet-body').innerHTML = '<div class="mx-auto mb-4 h-1.5 w-12 rounded-full bg-line"></div>' + html;
    document.getElementById('overlay').hidden = false;
    document.getElementById('sheet').hidden = false;
    document.getElementById('sheet').scrollTop = 0;
    sheetOnClose = onClose || null;
  }
  function closeSheet() {
    document.getElementById('overlay').hidden = true;
    document.getElementById('sheet').hidden = true;
    document.getElementById('sheet-body').innerHTML = '';
    var cb = sheetOnClose;
    sheetOnClose = null;
    if (cb) cb();
  }
  var pendingConfirm = null;
  function confirmSheet(title, body, yesLabel, onYes) {
    pendingConfirm = onYes;
    openSheet(
      '<h2 class="font-display text-xl font-bold">' + esc(title) + '</h2>' +
      '<p class="text-mute mt-2">' + esc(body) + '</p>' +
      '<div class="grid grid-cols-2 gap-3 mt-6">' +
      '<button type="button" data-action="close-sheet" class="press tap rounded-2xl bg-panel2 border border-line font-semibold">Cancel</button>' +
      '<button type="button" data-action="confirm-yes" class="press tap rounded-2xl bg-bad text-ink font-bold">' + esc(yesLabel) + '</button>' +
      '</div>'
    );
  }

  /* ---------- Views ---------- */
  function renderHeader() {
    var t = todayStr();
    var dayNum = started() ? diffDays(P().startDate, t) + 1 : 0;
    document.getElementById('header-date').textContent = fmtDate(t) + (dayNum >= 1 ? ' · Day ' + dayNum + ' of your plan' : ' · Plan not started yet');
    var btns = document.querySelectorAll('.nav-btn');
    for (var i = 0; i < btns.length; i++) {
      var active = btns[i].getAttribute('data-tab') === state.ui.tab;
      var isGym = btns[i].getAttribute('data-tab') === 'gym';
      btns[i].classList.toggle('text-mute', !active);
      btns[i].classList.toggle(isGym ? 'text-bolt' : 'text-em', active);
      btns[i].setAttribute('aria-current', active ? 'page' : 'false');
    }
  }

  function render() {
    renderHeader();
    var v = document.getElementById('view');
    var tab = state.ui.tab;
    if (tab === 'gym') v.innerHTML = viewGym();
    else if (tab === 'weight') v.innerHTML = viewWeight();
    else if (tab === 'nutrition') v.innerHTML = viewNutrition();
    else v.innerHTML = viewDashboard();
    updateTimer();
  }

  /* Dashboard */
  function viewDashboard() {
    var t = todayStr();
    var isStarted = started();
    var cw = isStarted ? currentWeight() : PROFILE_KG;
    var start = isStarted ? P().startWeight : PROFILE_KG;
    var b = bmiOf(cw);
    var hr = healthyRange();
    var target = hr.high;
    var totalToLose = Math.max(0.1, start - target);
    var lost = start - cw;
    var progressPct = clamp((lost / totalToLose) * 100, 0, 100);
    var remainingKg = Math.max(0, cw - target);
    var daysLeft = Math.ceil((remainingKg / P().weeklyLossKg) * 7);
    var wk = Math.floor(daysLeft / 7), dd = daysLeft % 7;
    var eta = addDays(t, daysLeft);
    var planToday = isStarted ? planWeightOn(t) : cw;
    var gap = cw - planToday;
    var hasWeights = state.weights.length > 0;
    var ms = nextMilestone(cw);
    var d = dayTotals(t);
    var calPct = d.target > 0 ? (d.eaten / d.target) * 100 : 0;
    var over = d.remaining < 0;
    var protPct = (d.protein / P().proteinGoal) * 100;
    var goalGlasses = waterGlassGoal();
    var waterPct = (d.glasses / goalGlasses) * 100;
    var fb = feedback();
    var session = state.activeSession;
    var nextMeal = nextPlanItem(t);

    var trackChip;
    if (!hasWeights) trackChip = '<span class="text-xs text-mute">Log a weight to compare with the plan</span>';
    else if (gap <= 0.5) trackChip = '<span class="inline-flex rounded-full bg-em-soft text-em border border-em/40 px-2.5 py-1 text-xs font-semibold">On track with the plan</span>';
    else trackChip = '<span class="inline-flex rounded-full bg-warn-soft text-warn border border-warn/40 px-2.5 py-1 text-xs font-semibold num">' + f1(gap) + ' kg behind the plan line</span>';

    var html = '';

    // Profile
    if (!isStarted) {
      html += card(
        '<div class="label">Day 1 not started</div>' +
        '<h2 class="font-display text-2xl font-bold mt-2">Start whenever you are ready</h2>' +
        '<p class="text-sm text-mute mt-2">Your plan begins the morning you log your first weigh-in. That weight becomes your starting point and that day becomes day 1. Nothing is counted until then.</p>' +
        '<div class="grid grid-cols-2 gap-2 mt-4">' + statTile('Height', P().height + '<span class="text-sm text-mute"> cm</span>') + statTile('Per week', '−1<span class="text-sm text-mute"> kg</span>') + '</div>' +
        '<button type="button" data-action="goto-weight" class="press tap w-full mt-4 rounded-2xl bg-em text-ink font-bold text-lg">Log my first weigh-in</button>'
      );
      html += card(
        '<div class="flex items-center justify-between gap-2"><h2 class="font-display text-lg font-bold">Road to a healthy weight</h2>' +
        '<span class="text-xs text-mute num">' + f1(hr.low) + '–' + f1(hr.high) + ' kg</span></div>' +
        '<p class="text-sm text-mute mt-1">Healthy BMI for ' + P().height + ' cm tops out at ' + f1(target) + ' kg. Your countdown, target date and progress bar appear after your first weigh-in.</p>'
      , 'mt-4');
    } else {
    html += card(
      '<div class="flex items-start justify-between gap-3">' +
        '<div class="min-w-0"><div class="label">Current weight</div>' +
        '<div class="font-display font-bold text-5xl leading-none mt-2 num">' + f1(cw) + '<span class="text-2xl text-mute font-semibold"> kg</span></div>' +
        '<div class="text-sm text-mute mt-2 num">Started at ' + f1(start) + ' kg on ' + fmtShort(P().startDate) + '</div></div>' +
        '<div class="text-right shrink-0"><div class="label">Lost</div><div class="font-display text-3xl font-bold text-em mt-2 num">' + f1(Math.max(0, lost)) + '</div><div class="text-xs text-mute">kg</div></div>' +
      '</div>' +
      '<div class="grid grid-cols-3 gap-2 mt-4">' +
        statTile('Height', P().height + '<span class="text-sm text-mute"> cm</span>') +
        statTile('BMI', f1(b)) +
        statTile('Per week', '−1<span class="text-sm text-mute"> kg</span>') +
      '</div>' +
      '<div class="text-xs text-mute mt-3">BMI category: <span class="text-fg font-medium">' + bmiClass(b) + '</span></div>'
    );

    // Journey
    html += card(
      '<div class="flex items-center justify-between gap-2"><h2 class="font-display text-lg font-bold">Road to a healthy weight</h2>' +
      '<span class="text-xs text-mute num">' + f1(hr.low) + '–' + f1(hr.high) + ' kg</span></div>' +
      '<p class="text-sm text-mute mt-1">Healthy BMI for ' + P().height + ' cm tops out at ' + f1(target) + ' kg. At 1 kg a week, here is your countdown.</p>' +
      (remainingKg > 0 ?
        '<div class="grid grid-cols-3 gap-2 mt-4">' +
          statTile('Weeks', '<span class="text-em">' + wk + '</span>') +
          statTile('Days', '<span class="text-em">' + dd + '</span>') +
          statTile('To go', f1(remainingKg) + '<span class="text-sm text-mute"> kg</span>') +
        '</div>' +
        '<div class="mt-4">' + bar(progressPct, 'bg-em') + '</div>' +
        '<div class="flex justify-between text-xs text-mute mt-2 num"><span>' + f1(start) + ' kg</span><span class="text-em font-semibold">' + progressPct.toFixed(0) + '% there</span><span>' + f1(target) + ' kg</span></div>' +
        '<div class="mt-4 flex flex-wrap items-center gap-2 justify-between"><div class="text-sm">Target date <span class="font-semibold num">' + fmtDateYear(eta) + '</span></div>' + trackChip + '</div>' +
        (ms ? '<div class="mt-3 rounded-2xl bg-ink border border-line p-3 text-sm flex items-center justify-between gap-2"><span class="text-mute">Next milestone: <span class="text-fg">' + esc(ms.label) + '</span></span><span class="font-semibold num whitespace-nowrap">' + f1(ms.kg) + ' kg <span class="text-mute font-normal">(' + f1(cw - ms.kg) + ' to go)</span></span></div>' : '')
      :
        '<div class="mt-4 rounded-2xl bg-em-soft border border-em/40 p-4 text-em font-semibold">You have reached the healthy BMI range. Incredible work.</div>'
      )
    , 'mt-4');
    }

    // Daily summary
    var ringInner = '<div class="label">' + (over ? 'Over by' : 'Remaining') + '</div><div class="font-display font-bold text-3xl num ' + (over ? 'text-warn' : 'text-em') + '">' + fmtInt(Math.abs(d.remaining)) + '</div><div class="text-xs text-mute">kcal</div>';
    html += card(
      '<div class="flex items-center justify-between"><h2 class="font-display text-lg font-bold">Daily summary</h2><span class="text-xs text-mute">' + fmtDate(t) + '</span></div>' +
      '<div class="flex items-center gap-4 mt-3">' +
        ring(calPct, over ? '#f5b84b' : '#14d18f', 132, 12, ringInner) +
        '<div class="flex-1 min-w-0 space-y-2 text-sm num">' +
          '<div class="flex justify-between gap-2"><span class="text-mute">Baseline</span><span>' + fmtInt(P().calorieBase) + '</span></div>' +
          '<div class="flex justify-between gap-2"><span class="text-mute">+ Exercise</span><span class="text-bolt font-semibold">' + fmtInt(d.burned) + '</span></div>' +
          '<div class="flex justify-between gap-2"><span class="text-mute">− Food</span><span>' + fmtInt(d.eaten) + '</span></div>' +
          '<div class="flex justify-between gap-2 border-t border-line pt-2 font-semibold"><span>Today\'s target</span><span>' + fmtInt(d.target) + '</span></div>' +
        '</div>' +
      '</div>' +
      '<div class="grid grid-cols-1 gap-3 mt-4">' +
        '<div><div class="flex justify-between text-sm mb-1.5"><span class="text-mute">Protein</span><span class="num font-semibold">' + fmtInt(d.protein) + ' / ' + P().proteinGoal + ' g</span></div>' + bar(protPct, 'bg-em') + '</div>' +
        '<div><div class="flex justify-between text-sm mb-1.5"><span class="text-mute">Water</span><span class="num font-semibold">' + (d.waterMl / 1000).toFixed(2) + ' / ' + (P().waterGoalMl / 1000).toFixed(1) + ' L</span></div>' + bar(waterPct, 'bg-bolt') + '</div>' +
      '</div>' +
      (nextMeal ? '<div class="mt-4 rounded-2xl bg-ink border border-line p-3 flex items-center gap-3"><div class="flex-1 min-w-0"><div class="label">Next meal · ' + nextMeal.time + '</div><div class="font-semibold truncate">' + esc(nextMeal.name) + '</div><div class="text-xs text-mute num">' + nextMeal.kcal + ' kcal · ' + nextMeal.protein + ' g protein</div></div>' + planButton(nextMeal, t) + '</div>' : '<div class="mt-4 rounded-2xl bg-em-soft border border-em/40 p-3 text-sm text-em font-semibold">All 4 planned meals logged today.</div>') +
      '<div class="grid grid-cols-2 gap-3 mt-4">' +
        '<button type="button" data-action="water-add" data-date="' + t + '" class="press tap rounded-2xl bg-bolt-soft border border-bolt/40 text-bolt font-bold flex items-center justify-center gap-2">' + ICON.drop + ' +250 ml</button>' +
        '<button type="button" data-action="goto-meal" class="press tap rounded-2xl bg-em-soft border border-em/40 text-em font-bold flex items-center justify-center gap-2">' + ICON.plus + ' Add meal</button>' +
        '<button type="button" data-action="goto-weight" class="press tap rounded-2xl bg-panel2 border border-line font-bold">Log weight</button>' +
        '<button type="button" data-action="nav" data-tab="gym" class="press tap rounded-2xl bg-bolt text-ink font-bold">' + (session ? 'Resume workout' : 'Start workout') + '</button>' +
      '</div>'
    , 'mt-4');

    // Weekly feedback
    html += card(
      '<div class="flex items-center justify-between gap-2"><h2 class="font-display text-lg font-bold">This week</h2>' + badge(fb.status) + '</div>' +
      '<div class="font-semibold mt-2">' + esc(fb.title) + '</div>' +
      '<p class="text-sm text-mute mt-1">' + esc(fb.body) + '</p>' +
      '<button type="button" data-action="nav" data-tab="weight" class="press mt-3 text-sm font-semibold text-em">See weight trend</button>'
    , 'mt-4');

    return html;
  }

  function statTile(label, valueHtml) {
    return '<div class="rounded-2xl bg-ink border border-line px-3 py-3 min-w-0"><div class="label">' + esc(label) + '</div><div class="font-display font-bold text-2xl mt-1 num truncate">' + valueHtml + '</div></div>';
  }

  /* Weight */
  function viewWeight() {
    var t = todayStr();
    var ws = sortedWeights();
    var existing = state.weights.filter(function (w) { return w.date === t; })[0];
    var fb = feedback();
    var weeks = weeklyAverages();
    var html = '';

    html += card(
      '<h2 class="font-display text-lg font-bold">Morning weigh-in</h2>' +
      '<p class="text-sm text-mute mt-1">After the bathroom, before breakfast. One entry per day; saving the same date again replaces it.</p>' +
      '<form data-form="weight" class="mt-4 space-y-3" autocomplete="off">' +
        '<div class="grid grid-cols-5 gap-3">' +
          '<label class="col-span-3 block"><span class="label">Weight (kg)</span><input id="w-kg" name="kg" type="text" inputmode="decimal" placeholder="' + (currentWeight() ? f1(currentWeight()) : '0.0') + '" value="' + (existing ? f1(existing.kg) : '') + '" class="field mt-1 text-2xl font-display font-bold num"></label>' +
          '<label class="col-span-2 block"><span class="label">Date</span><input id="w-date" name="date" type="date" max="' + t + '" value="' + t + '" class="field mt-1 text-sm"></label>' +
        '</div>' +
        '<button type="submit" class="press tap w-full rounded-2xl bg-em text-ink font-bold text-lg">Save weight</button>' +
      '</form>'
    );

    html += card(
      '<div class="flex items-center justify-between gap-2"><h2 class="font-display text-lg font-bold">Coach</h2>' + badge(fb.status, true) + '</div>' +
      '<div class="font-semibold mt-3">' + esc(fb.title) + '</div>' +
      '<p class="text-sm text-mute mt-1 leading-relaxed">' + esc(fb.body) + '</p>' +
      (fb.tips.length ? '<ul class="mt-3 space-y-2">' + fb.tips.map(function (x) { return '<li class="flex gap-2 text-sm"><span class="mt-1.5 h-1.5 w-1.5 rounded-full bg-em shrink-0"></span><span>' + esc(x) + '</span></li>'; }).join('') + '</ul>' : '')
    , 'mt-4');

    html += card(
      '<div class="flex items-center justify-between gap-2"><h2 class="font-display text-lg font-bold">Trend</h2>' +
      '<div class="flex items-center gap-3 text-xs text-mute"><span class="flex items-center gap-1"><span class="h-0.5 w-4 bg-em inline-block"></span>You</span><span class="flex items-center gap-1"><span class="w-4 inline-block border-t-2 border-dashed border-bolt"></span>1 kg/wk plan</span></div></div>' +
      '<div class="mt-3">' + weightChart(ws) + '</div>'
    , 'mt-4');

    html += card(
      '<h2 class="font-display text-lg font-bold">Weekly averages</h2>' +
      (weeks.length ? '<div class="mt-3 divide-y divide-line">' + weeks.slice().reverse().map(function (w) {
        var change = w.change === null ? '<span class="text-mute">vs start ' + signed1(w.avg - P().startWeight) + '</span>' :
          '<span class="' + (w.change < 0 ? 'text-em' : 'text-warn') + ' font-semibold">' + signed1(w.change) + ' kg</span>';
        return '<div class="py-3 flex items-center justify-between gap-3">' +
          '<div class="min-w-0"><div class="font-semibold">Week of ' + fmtShort(w.week) + (w.inProgress ? ' <span class="text-xs text-mute font-normal">· in progress</span>' : '') + '</div>' +
          '<div class="text-xs text-mute num">' + w.count + ' weigh-in' + (w.count === 1 ? '' : 's') + ' · ' + change + '</div></div>' +
          '<div class="text-right shrink-0"><div class="font-display font-bold text-xl num">' + f1(w.avg) + '</div><div class="mt-1">' + badge(w.status) + '</div></div></div>';
      }).join('') + '</div>' : '<p class="text-sm text-mute mt-2">Your weekly averages appear here after your first weigh-in.</p>')
    , 'mt-4');

    html += card(
      '<h2 class="font-display text-lg font-bold">History</h2>' +
      (ws.length ? '<div class="mt-2 divide-y divide-line">' + ws.slice().reverse().map(function (w, i, arr) {
        var prev = arr[i + 1];
        var delta = prev ? w.kg - prev.kg : w.kg - P().startWeight;
        var wkAvg = weeks.filter(function (x) { return x.week === weekStart(w.date); })[0];
        return '<div class="py-3 flex items-center gap-3">' +
          '<div class="flex-1 min-w-0"><div class="font-semibold">' + fmtDate(w.date) + '</div><div class="text-xs text-mute num">Week avg ' + (wkAvg ? f1(wkAvg.avg) : '–') + ' kg</div></div>' +
          '<div class="text-right"><div class="font-display font-bold text-lg num">' + f1(w.kg) + '</div><div class="text-xs num ' + (delta < 0 ? 'text-em' : delta > 0 ? 'text-warn' : 'text-mute') + '">' + (prev ? signed1(delta) : 'Day 1') + '</div></div>' +
          '<button type="button" data-action="weight-delete" data-id="' + esc(w.id) + '" aria-label="Delete weight for ' + fmtDate(w.date) + '" class="press w-11 h-11 rounded-xl bg-ink border border-line flex items-center justify-center text-mute">' + ICON.trash + '</button></div>';
      }).join('') + '</div>' : '<p class="text-sm text-mute mt-2">No weigh-ins yet. Your first one goes above.</p>')
    , 'mt-4');

    return html;
  }

  function weightChart(ws) {
    var W = 340, H = 180, L = 36, R = 10, T = 12, B = 26;
    if (!ws.length || !started()) {
      return '<svg viewBox="0 0 ' + W + ' 80" class="w-full h-auto" role="img" aria-label="Weight trend chart, empty"><rect x="0" y="0" width="' + W + '" height="80" rx="12" fill="#0b0f14"></rect><text x="' + (W / 2) + '" y="45" text-anchor="middle" font-size="12" fill="#8b98a9">Your line starts with the first weigh-in</text></svg>';
    }
    var start = P().startDate;
    var t = todayStr();
    var first = ws.length ? (ws[0].date < start ? ws[0].date : start) : start;
    var last = ws.length ? ws[ws.length - 1].date : t;
    if (last < t) last = t;
    var span = Math.max(14, diffDays(first, last));
    var endDate = addDays(first, span);
    var planA = planWeightOn(first), planB = planWeightOn(endDate);
    var vals = ws.map(function (w) { return w.kg; }).concat([planA, planB, P().startWeight]);
    var minV = Math.floor(Math.min.apply(null, vals) - 1);
    var maxV = Math.ceil(Math.max.apply(null, vals) + 1);
    if (maxV - minV < 4) { maxV += 2; minV -= 2; }
    function x(ds) { return L + (diffDays(first, ds) / span) * (W - L - R); }
    function y(v) { return T + (1 - (v - minV) / (maxV - minV)) * (H - T - B); }
    var grid = '';
    var step = (maxV - minV) > 12 ? 4 : 2;
    for (var g = Math.ceil(minV / step) * step; g <= maxV; g += step) {
      grid += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(g).toFixed(1) + '" y2="' + y(g).toFixed(1) + '" stroke="#263142" stroke-width="1"></line>' +
        '<text x="' + (L - 6) + '" y="' + (y(g) + 4).toFixed(1) + '" text-anchor="end" font-size="10" fill="#8b98a9">' + g + '</text>';
    }

  /* Gym */
  function allExerciseNames() {
    var set = {};

    state.workouts.forEach(function (w) { (w.exercises || []).forEach(function (e) { set[e.name] = 1; }); });
    return Object.keys(set).sort();
  }

  function lastPerformance(name, excludeId) {
    var key = name.trim().toLowerCase();
    var ws = state.workouts.slice().sort(function (a, b) { return (b.date + (b.startedAt || 0)) < (a.date + (a.startedAt || 0)) ? -1 : 1; });
    for (var i = 0; i < ws.length; i++) {
      if (ws[i].id === excludeId) continue;
      var ex = (ws[i].exercises || []).filter(function (e) { return e.name.trim().toLowerCase() === key; })[0];
      if (ex && ex.sets && ex.sets.length) return { date: ws[i].date, sets: ex.sets };
    }
    return null;
  }

  function setsText(sets) {
    return sets.map(function (s) { var kg = num(s.kg); return (isFinite(kg) && kg > 0 ? r1(kg) + '×' : 'BW×') + (num(s.reps) || 0); }).join(', ');
  }

  // Weekly plan, keyed by JavaScript day number (0 = Sunday). Friday is off.
  var WEEK_ORDER = [6, 0, 1, 2, 3, 4, 5];
  var WEEK_PLAN = { 6: 'upperA', 0: 'lowerA', 1: 'walk', 2: 'upperB', 3: 'lowerB', 4: 'walk', 5: null };
  var DOW_SHORT = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

  function makeExercise(name, target) {
    var lp = lastPerformance(name);
    var sets;
    var count = target ? target[0] : 3;
    if (lp) sets = lp.sets.map(function (s) { return { kg: s.kg === undefined ? '' : String(s.kg), reps: s.reps === undefined ? '' : String(s.reps), done: false }; });
    else { sets = []; for (var i = 0; i < count; i++) sets.push({ kg: '', reps: '', done: false }); }
    var ex = { id: uid(), name: name, sets: sets };
    if (target) ex.target = { sets: target[0], reps: target[1] };
    return ex;
  }
  function repRange(t) {
    var p = String(t.reps).split('-').map(Number);
    return { low: p[0], high: p.length > 1 ? p[1] : p[0] };
  }
  function progressionTip(ex, lp) {
    if (!ex.target) return lp ? 'Beat it: add 1 rep or 2.5 kg' : '';
    var r = repRange(ex.target);
    var big = /squat|leg press|deadlift/i.test(ex.name) && !/goblet/i.test(ex.name);
    var plank = /plank/i.test(ex.name);
    if (!lp) return plank ? 'Hold each set for ' + ex.target.reps + ' seconds.' : 'Pick a weight you can do for ' + r.high + ' clean reps, then stop at ' + r.low + ' to ' + r.high + '.';
    var allTop = lp.sets.length >= ex.target.sets && lp.sets.every(function (st) { return num(st.reps) >= r.high; });
    if (plank) return allTop ? 'You held the full time. Add 10 seconds.' : 'Add a few seconds to each hold.';
    if (allTop) return 'You hit ' + r.high + ' on every set. Add ' + (big ? '5' : '2.5') + ' kg today.';
    return 'Same weight. Add a rep to each set until you hit ' + r.high + ', then add weight.';

  function cardioMet(type) {

  }
  function cardioEstimate(type, minutes) {
    var m = num(minutes);
    if (!isFinite(m) || m <= 0) return 0;

  function chip(text) {
    return '<span class="inline-flex rounded-full bg-ink border border-line px-2.5 py-1 text-mute">' + esc(text) + '</span>';
  }

  function progressSummary() {
    var map = {};
    var ws = state.workouts.slice().sort(function (a, b) { return a.date === b.date ? (a.startedAt || 0) - (b.startedAt || 0) : (a.date < b.date ? -1 : 1); });
    ws.forEach(function (w) {
      (w.exercises || []).forEach(function (e) {
        var top = null;
        e.sets.forEach(function (s) {
          var kg = num(s.kg), reps = num(s.reps);
          if (!isFinite(kg) || kg <= 0 || !isFinite(reps) || reps <= 0) return;
          var e1 = kg * (1 + reps / 30);
          if (!top || e1 > top.e1) top = { kg: kg, reps: reps, e1: e1 };
        });
        if (!top) return;
        var k = e.name.trim().toLowerCase();
        if (!map[k]) map[k] = { name: e.name, tops: [], lastDate: w.date };
        map[k].tops.push(top);
        map[k].lastDate = w.date;
      });
    });
    return Object.keys(map).map(function (k) {
      var m = map[k];
      var tops = m.tops;
      return {
        name: m.name,
        lastDate: m.lastDate,
        lastTop: tops[tops.length - 1],
        prevTop: tops.length > 1 ? tops[tops.length - 2] : null,
        best: tops.reduce(function (a, t) { return t.e1 > a ? t.e1 : a; }, 0)
      };
    }).sort(function (a, b) { return a.lastDate < b.lastDate ? 1 : a.lastDate > b.lastDate ? -1 : a.name.localeCompare(b.name); });
  }

    var sec = Math.max(0, Math.floor((Date.now() - state.activeSession.startedAt) / 1000));
    var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
    el.textContent = (h ? h + ':' + pad(m) : m) + ':' + pad(s);
  }

  /* Nutrition */
  function defaultMealType() {
    var h = new Date().getHours();
    if (h < 12) return 'breakfast';
    if (h < 16) return 'lunch';
    if (h < 21) return 'dinner';
    return 'snacks';
  }

      var k = (m.name || '').trim().toLowerCase();

      out.push(m);

    return out.slice(0, 8);
  }

  function startSession(name, exerciseNames, cardioTypes, targets, cardioMin) {
    var cm = cardioMin || 30;
    state.activeSession = {
      id: uid(),
      name: name,
      date: todayStr(),
      startedAt: Date.now(),
      exercises: exerciseNames.map(function (n) { return makeExercise(n, targets ? targets[n] : null); }),
      cardio: (cardioTypes || []).map(function (ct) { return { id: uid(), type: ct, minutes: String(cm), kcal: String(cardioEstimate(ct, cm)), kcalEdited: false }; })
    };
    state.ui.tab = 'gym';
    state.ui.gymTab = 'log';
    save();
    render();
    window.scrollTo(0, 0);
  }

  function openFinish() {
    var s = state.activeSession;
    var elapsed = Math.round((Date.now() - s.startedAt) / 60000);
    if (elapsed < 1) elapsed = 1;
    if (elapsed > 240) elapsed = 60;
    var cardioMin = (s.cardio || []).reduce(function (a, c) { return a + (num(c.minutes) || 0); }, 0);
    var cardioKcal = (s.cardio || []).reduce(function (a, c) { return a + (num(c.kcal) || 0); }, 0);
    var hasStrength = s.exercises.some(function (e) { return e.sets.some(function (st) { return num(st.reps) > 0; }); });
    var strengthMin = hasStrength ? Math.max(0, elapsed - cardioMin) : 0;
    if (hasStrength && strengthMin < 10) strengthMin = Math.max(10, elapsed);
    var strengthKcal = Math.round(STRENGTH_MET * estKg() * strengthMin / 60);
    var total = Math.round(cardioKcal + strengthKcal);
    var done = s.exercises.reduce(function (a, e) { return a + e.sets.filter(function (st) { return num(st.reps) > 0; }).length; }, 0);
    openSheet(
      '<h2 class="font-display text-xl font-bold">Finish ' + esc(s.name) + '</h2>' +
      '<p class="text-sm text-mute mt-1 num">' + done + ' set' + (done === 1 ? '' : 's') + ' logged · ' + fmtInt(sessionVolume(s)) + ' kg volume' + (cardioMin ? ' · ' + cardioMin + ' min cardio' : '') + '</p>' +
      '<form data-form="finish" class="mt-4 space-y-3" autocomplete="off">' +
        '<div class="grid grid-cols-2 gap-3">' +
          '<label class="block"><span class="label">Duration (min)</span><input id="fin-duration" name="duration" type="text" inputmode="numeric" value="' + elapsed + '" class="field blue mt-1 text-xl font-bold num"></label>' +
          '<label class="block"><span class="label">kcal burned</span><input id="fin-kcal" name="kcal" type="text" inputmode="numeric" value="' + total + '" class="field blue mt-1 text-xl font-bold num"></label>' +
        '</div>' +
        '<p class="text-xs text-mute num">Estimate: lifting ' + fmtInt(strengthKcal) + ' kcal (' + strengthMin + ' min) + cardio ' + fmtInt(cardioKcal) + ' kcal, ' + (currentWeight() ? 'based on ' + f1(currentWeight()) + ' kg.' : 'estimated until your first weigh-in.') + ' This amount gets added to today\'s calorie target.</p>' +
        '<label class="block"><span class="label">Notes</span><textarea id="fin-notes" name="notes" placeholder="How did it feel? Any pain, PRs, gym was busy..." class="field blue mt-1"></textarea></label>' +
        '<button type="submit" class="press tap w-full rounded-2xl bg-bolt text-ink font-bold text-lg">Save session</button>' +
      '</form>' +
      '<button type="button" data-action="close-sheet" class="press tap w-full mt-3 rounded-2xl bg-panel2 border border-line font-semibold">Keep training</button>'
    );
  }

  /* ---------- Actions ---------- */
  function setWater(date, n) {
    state.water[date] = Math.max(0, Math.min(40, n));
    if (state.water[date] === 0) delete state.water[date];
    save();
  }

  function navTo(tab) {
    state.ui.tab = tab;
    save();
    render();
    window.scrollTo(0, 0);
    try { if (location.hash !== '#' + tab) history.replaceState(null, '', '#' + tab); } catch (e) { /* hash routing is a convenience only */ }
  }

  var actions = {
    'nav': function (el) { navTo(el.getAttribute('data-tab')); },
    'open-settings': function () { openSettings(); },
    'close-sheet': function () { pendingConfirm = null; closeSheet(); },
    'confirm-yes': function () { var f = pendingConfirm; pendingConfirm = null; closeSheet(); if (f) f(); },
    'goto-meal': function () {
      state.ui.nutritionDate = todayStr();
      navTo('nutrition');
      var i = document.getElementById('m-name');
      if (i) { i.scrollIntoView({ block: 'center' }); i.focus(); }
    },
    'goto-weight': function () {
      navTo('weight');
      var i = document.getElementById('w-kg');
      if (i) i.focus();
    },
    'water-add': function (el) {
      var d = el.getAttribute('data-date');
      setWater(d, (state.water[d] || 0) + 1);
      var g = state.water[d] || 0;
      render();
      toast(g === waterGlassGoal() ? 'Water goal reached: 3.5 L' : 'Logged 250 ml · ' + (g * P().glassMl / 1000).toFixed(2) + ' L today');
    },
    'water-minus': function (el) {
      var d = el.getAttribute('data-date');
      setWater(d, (state.water[d] || 0) - 1);
      render();
    },
    'water-tap': function (el) {
      var d = el.getAttribute('data-date');
      var i = parseInt(el.getAttribute('data-index'), 10);
      var cur = state.water[d] || 0;
      setWater(d, cur === i + 1 ? i : i + 1);
      render();
    },
    'weight-delete': function (el) {
      var id = el.getAttribute('data-id');
      var w = state.weights.filter(function (x) { return x.id === id; })[0];
      if (!w) return;
      confirmSheet('Delete this weigh-in?', fmtDate(w.date) + ': ' + f1(w.kg) + ' kg will be removed from your history.', 'Delete', function () {
        state.weights = state.weights.filter(function (x) { return x.id !== id; });
        save(); render(); toast('Weigh-in deleted');
      });
    },
    'meal-type': function (el) {
      state.ui.mealType = el.getAttribute('data-type');
      save(); render();
      if (el.getAttribute('data-focus')) {
        var i = document.getElementById('m-name');
        if (i) { i.scrollIntoView({ block: 'center' }); i.focus(); }
      }
    },
    'meal-recent': function (el) {
      var r = recentFoods()[parseInt(el.getAttribute('data-idx'), 10)];
      if (!r) return;
      var mt = state.ui.mealType || defaultMealType();
      state.meals.push({ id: uid(), date: state.ui.nutritionDate || todayStr(), type: mt, name: r.name, kcal: num(r.kcal) || 0, protein: num(r.protein) || 0, createdAt: Date.now() });
      save(); render();
      toast('Added ' + r.name + ' to ' + MEALS.filter(function (m) { return m.key === mt; })[0].label);
    },
    'meal-delete': function (el) {
      var id = el.getAttribute('data-id');
      state.meals = state.meals.filter(function (m) { return m.id !== id; });
      save(); render(); toast('Removed');
    },
    'nutri-shift': function (el) {
      var delta = parseInt(el.getAttribute('data-delta'), 10);
      var nd = addDays(state.ui.nutritionDate || todayStr(), delta);
      if (nd > todayStr()) return;
      state.ui.nutritionDate = nd;
      save(); render();
    },
    'activity-delete': function (el) {
      var id = el.getAttribute('data-id');
      state.activities = state.activities.filter(function (a) { return a.id !== id; });
      save(); render(); toast('Removed');
    },
    'gym-tab': function (el) { state.ui.gymTab = el.getAttribute('data-v'); save(); render(); },
    'gym-template': function (el) { openTemplate(el.getAttribute('data-key')); },
    'guide': function (el) { openGuide(el.getAttribute('data-name'), el.getAttribute('data-back')); },
    'open-prep': function () { openPrep(); },
    'snack-log': function (el) {
      var x = EXTRA_SNACKS.filter(function (m) { return m.id === el.getAttribute('data-id'); })[0];
      if (!x) return;
      state.meals.push({ id: uid(), date: el.getAttribute('data-date') || todayStr(), type: 'snacks', name: x.name, kcal: x.kcal, protein: x.protein, snackId: x.id, createdAt: Date.now() });
      save(); render();
      toast('Logged ' + x.name + ' · ' + x.kcal + ' kcal. Remove it under Snacks below.');
    },
    'snack-choice': function (el) {
      P().snack = el.getAttribute('data-v');
      save(); render();
      toast(snackChoice() === 'milk' ? 'Almarai milk tonight · oats removed from breakfast' : 'Whey shake tonight · oats back at breakfast');
    },
    'breakfast-choice': function (el) {
      P().breakfast = el.getAttribute('data-v');
      save(); render();
      toast('Breakfast set to ' + BREAKFASTS[breakfastChoice()].label.toLowerCase());
    },
    'plan-log': function (el) {
      var item = dayPlan().filter(function (m) { return m.id === el.getAttribute('data-id'); })[0];
      var date = el.getAttribute('data-date') || todayStr();
      if (!item || planLogged(date, item.id)) return;
      state.meals.push({ id: uid(), date: date, type: item.type, name: item.name, kcal: item.kcal, protein: item.protein, planId: item.id, createdAt: Date.now() });
      save(); render();
      toast('Logged ' + item.name + ' · ' + item.kcal + ' kcal');
    },
    'plan-undo': function (el) {
      var date = el.getAttribute('data-date') || todayStr();
      var m = planLogged(date, el.getAttribute('data-id'));
      if (!m) return;
      state.meals = state.meals.filter(function (x) { return x.id !== m.id; });
      save(); render();
      toast('Removed ' + m.name);
    },
    'gym-start': function (el) {
      var key = el.getAttribute('data-key');
      var tp = TEMPLATES[key];
      var names = [];
      var checks = document.querySelectorAll('.tpl-check');
      if (checks.length) {
        for (var i = 0; i < checks.length; i++) if (checks[i].checked) names.push(checks[i].getAttribute('data-name'));
      } else {
        names = tp.exercises.slice();
      }
      closeSheet();
      startSession(tp.name, names, tp.cardio || [], tp.targets || null, tp.cardioMin);
      toast(tp.name + ' started');
    },
    'set-toggle': function (el) {
      var s = state.activeSession; if (!s) return;
      var ex = s.exercises[+el.getAttribute('data-ex')];
      var st = ex && ex.sets[+el.getAttribute('data-set')];
      if (!st) return;
      if (!st.done) {
        var si = +el.getAttribute('data-set');
        var lp = lastPerformance(ex.name);
        var ph = lp && lp.sets[si] ? lp.sets[si] : null;
        if (st.kg === '' && ph && ph.kg !== '') st.kg = String(ph.kg);
        if (st.reps === '' && ph) st.reps = String(ph.reps);
        if (st.reps === '' && si > 0 && ex.sets[si - 1].reps !== '') st.reps = ex.sets[si - 1].reps;
        if (st.kg === '' && si > 0 && ex.sets[si - 1].kg !== '') st.kg = ex.sets[si - 1].kg;
      }
      st.done = !st.done;
      save(); render();
    },
    'set-add': function (el) {
      var s = state.activeSession; if (!s) return;
      var ex = s.exercises[+el.getAttribute('data-ex')]; if (!ex) return;
      var last = ex.sets[ex.sets.length - 1];
      ex.sets.push({ kg: last ? last.kg : '', reps: last ? last.reps : '', done: false });
      save(); render();
    },
    'set-remove': function (el) {
      var s = state.activeSession; if (!s) return;
      var ex = s.exercises[+el.getAttribute('data-ex')]; if (!ex || ex.sets.length <= 1) return;
      ex.sets.pop();
      save(); render();
    },
    'ex-remove': function (el) {
      var s = state.activeSession; if (!s) return;
      var idx = +el.getAttribute('data-ex');
      var ex = s.exercises[idx]; if (!ex) return;
      confirmSheet('Remove ' + ex.name + '?', 'Its sets in this session will be cleared.', 'Remove', function () {
        s.exercises.splice(idx, 1);
        save(); render();
      });
    },
    'cardio-add': function () {
      var s = state.activeSession; if (!s) return;
      if (!s.cardio) s.cardio = [];
      var type = CARDIO_TYPES[0].name;
      s.cardio.push({ id: uid(), type: type, minutes: '20', kcal: String(cardioEstimate(type, 20)), kcalEdited: false });
      save(); render();
    },
    'cardio-remove': function (el) {
      var s = state.activeSession; if (!s) return;
      s.cardio.splice(+el.getAttribute('data-ci'), 1);
      save(); render();
    },
    'session-finish': function () { if (state.activeSession) openFinish(); },
    'session-discard': function () {
      confirmSheet('Discard this workout?', 'Every set you logged in this session will be deleted. Past sessions are not affected.', 'Discard', function () {
        state.activeSession = null;
        save(); render(); toast('Workout discarded');
      });
    },
    'workout-toggle': function (el) {
      var id = el.getAttribute('data-id');
      state.ui.openWorkout = state.ui.openWorkout === id ? null : id;
      save(); render();
    },
    'workout-delete': function (el) {
      var id = el.getAttribute('data-id');
      var w = state.workouts.filter(function (x) { return x.id === id; })[0];
      if (!w) return;
      confirmSheet('Delete this session?', w.name + ' on ' + fmtDate(w.date) + ' will be removed, including its calories.', 'Delete', function () {
        state.workouts = state.workouts.filter(function (x) { return x.id !== id; });
        save(); render(); toast('Session deleted');
      });
    },
    'workout-repeat': function (el) {
      var w = state.workouts.filter(function (x) { return x.id === el.getAttribute('data-id'); })[0];
      if (!w) return;
      var go = function () { startSession(w.name, (w.exercises || []).map(function (e) { return e.name; }), (w.cardio || []).map(function (c) { return c.type; })); toast(w.name + ' started'); };
      if (state.activeSession) confirmSheet('Replace your current workout?', 'You have a session in progress. Starting this one discards it.', 'Replace', go);
      else go();
    },
    'backup-copy': function () {
      var data = JSON.stringify(Object.assign({}, state, { exportedAt: new Date().toISOString() }));
      var ta = document.getElementById('backup-text');
      var fallback = function () {
        if (ta) { ta.value = data; ta.focus(); ta.select(); }
        toast('Backup is in the box below. Select all and copy it.');
      };
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(data).then(function () { toast('Backup copied. Paste it somewhere safe.'); }, fallback);
        } else fallback();
      } catch (e) { fallback(); }
    },
    'backup-restore': function () {
      var ta = document.getElementById('backup-text');
      var raw = ta ? ta.value.trim() : '';
      if (!raw) { toast('Paste a backup into the box first'); return; }
      var parsed;
      try { parsed = JSON.parse(raw); } catch (e) { toast('That text is not a LaithFit backup. Copy the whole thing and try again.'); return; }
      if (!parsed || !parsed.profile || !Array.isArray(parsed.weights)) { toast('That text is not a LaithFit backup.'); return; }
      confirmSheet('Restore this backup?', 'Everything currently on this phone gets replaced by the backup.', 'Restore', function () {
        state = normalize(parsed);
        state.ui.tab = 'dashboard';
        save(); render(); toast('Backup restored');
      });
    },
    'reset-all': function () {
      confirmSheet('Erase all data?', 'All weigh-ins, meals, water and workouts on this phone will be deleted. Copy a backup first if you might want them.', 'Erase everything', function () {
        state = defaults();
        state.ui.nutritionDate = todayStr();
        save(); render(); toast('All data erased');
      });
    }
  };

  var forms = {
    weight: function (f) {
      var kg = num(f.kg.value);
      var date = f.date.value || todayStr();
      if (!isFinite(kg) || kg < 30 || kg > 300) { toast('Enter your weight in kg'); f.kg.focus(); return; }
      if (!isValidDate(date) || date > todayStr()) { toast('Pick today or an earlier date'); return; }
      var existing = state.weights.filter(function (w) { return w.date === date; })[0];
      if (existing) existing.kg = r1(kg);
      else state.weights.push({ id: uid(), date: date, kg: r1(kg) });
      save(); render();
      var fb = feedback();
      toast((existing ? 'Updated ' : 'Saved ') + f1(kg) + ' kg for ' + fmtShort(date) + (fb.status === 'target' ? ' · On target!' : ''));
    },
    meal: function (f) {
      var kcal = num(f.kcal.value);
      var protein = num(f.protein.value);
      var name = f.name.value.trim();
      if (!isFinite(kcal) || kcal < 0) { toast('Enter the calories for this food'); f.kcal.focus(); return; }
      if (!isFinite(protein) || protein < 0) protein = 0;
      var mt = state.ui.mealType || defaultMealType();
      state.ui.mealType = mt;
      state.meals.push({ id: uid(), date: state.ui.nutritionDate || todayStr(), type: mt, name: name || MEALS.filter(function (m) { return m.key === mt; })[0].label, kcal: Math.round(kcal), protein: r1(protein), createdAt: Date.now() });
      save(); render();
      toast('Added ' + Math.round(kcal) + ' kcal');
    },
    activity: function (f) {
      var kcal = num(f.kcal.value);
      var name = f.name.value.trim() || 'Activity';
      if (!isFinite(kcal) || kcal <= 0) { toast('Enter the calories burned'); f.kcal.focus(); return; }
      state.activities.push({ id: uid(), date: state.ui.nutritionDate || todayStr(), name: name, kcal: Math.round(kcal) });
      save(); render();
      toast('Target raised by ' + Math.round(kcal) + ' kcal');
    },
    'ex-add': function (f) {
      var name = f.name.value.trim();
      if (!name || !state.activeSession) { f.name.focus(); return; }
      state.activeSession.exercises.push(makeExercise(name));
      save(); render();
      toast(name + ' added');
    },
    finish: function (f) {
      var s = state.activeSession; if (!s) return;
      var exercises = s.exercises.map(function (e) {
        return {
          name: e.name,
          sets: e.sets.filter(function (st) { return num(st.reps) > 0; }).map(function (st) {
            var kg = num(st.kg);
            return { kg: isFinite(kg) && kg >= 0 ? r1(kg) : 0, reps: Math.round(num(st.reps)) };
          })
        };
      }).filter(function (e) { return e.sets.length; });
      var cardio = (s.cardio || []).filter(function (c) { return num(c.minutes) > 0; }).map(function (c) {
        return { type: c.type, minutes: Math.round(num(c.minutes)), kcal: Math.round(num(c.kcal) || 0) };
      });
      if (!exercises.length && !cardio.length) { closeSheet(); toast('Log at least one set (reps) or some cardio minutes first'); return; }
      var duration = Math.round(num(f.duration.value));
      var kcal = Math.round(num(f.kcal.value));
      state.workouts.push({
        id: s.id,
        name: s.name,
        date: isValidDate(s.date) ? s.date : todayStr(),
        startedAt: s.startedAt,
        durationMin: isFinite(duration) && duration > 0 ? duration : 0,
        kcal: isFinite(kcal) && kcal >= 0 ? kcal : 0,
        exercises: exercises,
        cardio: cardio,
        notes: f.notes.value.trim()
      });
      state.activeSession = null;
      state.ui.gymTab = 'history';
      state.ui.openWorkout = s.id;
      closeSheet();
      save(); render();
      window.scrollTo(0, 0);
      toast('Session saved · +' + (isFinite(kcal) ? kcal : 0) + ' kcal to today');
    },
    settings: function (f) {
      var p = P();
      var h = num(f.height.value), cb = num(f.calorieBase.value), pg = num(f.proteinGoal.value), wg = num(f.waterGoal.value);
      if (!isFinite(h) || h < 100 || h > 230) { toast('Height should be in cm, for example 172'); return; }
      if (!isFinite(cb) || cb < 800 || cb > 5000) { toast('Calorie baseline should be between 800 and 5,000'); return; }
      if (!isFinite(pg) || pg < 0 || pg > 400) { toast('Protein goal looks wrong'); return; }
      if (!isFinite(wg) || wg < 0.5 || wg > 8) { toast('Water goal should be in litres, for example 3.5'); return; }
      p.height = Math.round(h); p.calorieBase = Math.round(cb); p.proteinGoal = Math.round(pg);
      p.waterGoalMl = Math.round(wg * 4) * 250;
      save(); closeSheet(); render(); toast('Settings saved');
    }
  };

  /* ---------- Event wiring ---------- */
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-action]');
    if (!el || el.disabled) return;
    var fn = actions[el.getAttribute('data-action')];
    if (fn) { e.preventDefault(); fn(el, e); }
  });

  document.addEventListener('submit', function (e) {
    var f = e.target;
    var key = f.getAttribute('data-form');
    if (!key || !forms[key]) return;
    e.preventDefault();
    forms[key](f);
  });

  function onBind(e) {
    var t = e.target;
    var b = t.getAttribute && t.getAttribute('data-bind');
    if (!b) return;
    var s = state.activeSession;
    if (!s) return;
    if (b === 'set') {
      var ex = s.exercises[+t.getAttribute('data-ex')];
      var st = ex && ex.sets[+t.getAttribute('data-set')];
      if (!st) return;
      st[t.getAttribute('data-field')] = t.value;
      var vEl = document.getElementById('sess-volume');
      if (vEl) vEl.textContent = fmtInt(sessionVolume(s)) + ' kg';
      save();
    } else if (b === 'cardio') {
      var c = s.cardio[+t.getAttribute('data-ci')];
      if (!c) return;
      var field = t.getAttribute('data-field');
      c[field] = t.value;
      if (field === 'kcal') c.kcalEdited = true;
      if ((field === 'minutes' || field === 'type') && !c.kcalEdited) {
        c.kcal = String(cardioEstimate(c.type, c.minutes));
        var k = document.getElementById('c-' + c.id + '-kcal');
        if (k) k.value = c.kcal;
      }
      save();
    } else if (b === 'session-date') {
      if (isValidDate(t.value) && t.value <= todayStr()) { s.date = t.value; save(); }
    }
  }
  document.addEventListener('input', onBind);
  document.addEventListener('change', onBind);

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !document.getElementById('sheet').hidden) { pendingConfirm = null; closeSheet(); }
  });

  window.addEventListener('hashchange', function () {
    var h = location.hash.replace('#', '');
    if (['dashboard', 'gym', 'weight', 'nutrition'].indexOf(h) >= 0 && h !== state.ui.tab) { state.ui.tab = h; save(); render(); }
  });

  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) {
      if (state.ui.nutritionDate > todayStr()) state.ui.nutritionDate = todayStr();
      render();
    }
  });

  /* ---------- Boot ---------- */
  (function boot() {
    var h = location.hash.replace('#', '');
    if (['dashboard', 'gym', 'weight', 'nutrition'].indexOf(h) >= 0) state.ui.tab = h;
    if (!state.ui.tab) state.ui.tab = 'dashboard';
    state.ui.nutritionDate = todayStr();
    state.ui.mealType = null;
    if (!storageOK) document.getElementById('storage-warning').hidden = false;
    save();
    render();
    timerHandle = setInterval(updateTimer, 1000);
  })();
})();
</script>
<script>if ("serviceWorker" in navigator) { window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); }); }</script>
</body>
